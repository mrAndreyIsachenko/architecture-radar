    proposed_validation: Run a field or hardware-in-the-loop mission that exercises the full tool guard pipeline, then restart the control plane mid-mission and confirm the checkpointed mission state and audit trail recover coherently.
    success_condition: Unsafe calls remain blocked, mission checkpoints survive the restart, and the audit log reconstructs the mission timeline without losing guard decisions.
    priority: high
    status: open
    created: 2026-10-01
    last_updated: 2026-10-01

