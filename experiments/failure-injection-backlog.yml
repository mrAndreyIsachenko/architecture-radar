items:
  - id: 2026-09-13-headscale-reconnect-recovery
    family: privacy-networking-vpn
    source_report: reports/2026-09-13.md
    source_repository: juanfont/headscale
    mechanism: policy-guarded route reconciliation loop
    evidence_gap: Source and tests show route and policy reconciliation order, but the reviewed evidence does not validate reconnect and policy reload behavior under a live multi-node control plane with real disconnect/reconnect churn.
    validation_type: reconnect-recovery
    proposed_validation: Run a live reconnect test with subnet-router advertisements, policy reload, and approved-route clearing while capturing AllowedIPs, primary routes, and health-bit changes across disconnect/reconnect cycles.
    success_condition: Reconnect order, policy reload, and approved-route persistence converge without stale AllowedIPs, stale unhealthy bits, or replayed routes after restart.
    priority: high
    status: open
    created: 2026-09-13
    last_updated: 2026-09-13

  - id: 2026-09-13-fprime-router-runtime
    family: satellites-space-systems
    source_report: reports/2026-09-13.md
    source_repository: nasa/fprime
    mechanism: bounded context-preserving packet router
    evidence_gap: The router and unit tests prove bounded context restoration in source, but the review did not validate the buffer-context table under realistic packet rates, delayed returns, or integration with a full uplink stack.
    validation_type: runtime
    proposed_validation: Exercise the router in an integrated F Prime uplink with concurrent file and unknown packets, delayed buffer returns, and a saturated outstanding-buffer set to verify warning degradation only.
    success_condition: Context is restored on matching returns, overflow only emits warning degradation, and command/file routing remains correct under sustained load.
    priority: medium
    status: open
    created: 2026-09-13
    last_updated: 2026-09-13

  - id: 2026-09-13-ardupilot-sitl-failsafe
    family: drones-robotics-autonomy
    source_report: reports/2026-09-13.md
    source_repository: ArduPilot/ardupilot
    mechanism: mission failsafe fallback state machine
    evidence_gap: Source and autotests cover RC/GPS loss paths, but the review did not validate the same fallback ladder in a longer SITL mission with repeated recovery, restart, and mission-resume churn.
    validation_type: sitl
    proposed_validation: Run a long SITL mission that injects RC loss, GPS loss, and mode changes multiple times, then reboot the mission harness mid-run to confirm RTL/Land/SmartRTL behavior stays consistent.
    success_condition: The vehicle follows the expected fallback ladder each time, telemetry reflects the active failsafe state, and restart does not produce unsafe mission continuation.
    priority: high
    status: open
    created: 2026-09-13
    last_updated: 2026-09-13

  - id: 2026-09-16-nasa-fprime-runtime-restart
    family: satellites-space-systems
    source_report: reports/2026-09-16.md
    source_repository: nasa/fprime
    mechanism: command dispatcher and health monitor recovery
    evidence_gap: Source and tests verify command routing, pending tracking, ping cycles, and watchdog strobes, but the repository still needs a real restart or fault-injection run on a target build to prove those paths recover cleanly after a crash.
    validation_type: runtime
    proposed_validation: Run the command dispatcher and health component on a target or emulator build, kill the process mid-command and mid-ping cycle, restart it, and observe whether pending command state, ping sequencing, and watchdog strobes recover without duplicate acknowledgements.
    success_condition: After restart, the component reports a consistent command and health state, no command is acknowledged twice, and ping/watchdog behavior resumes from a deterministic baseline.
    priority: high
    status: open
    created: 2026-09-16
    last_updated: 2026-09-16
  - id: 2026-09-16-headscale-reconnect-recovery
    family: privacy-networking-vpn
    source_report: reports/2026-09-16.md
    source_repository: juanfont/headscale
    mechanism: session-epoch gated reconnect recovery and batched primary-route election
    evidence_gap: Source and tests pin the reconnect and HA election rules, but the control plane still needs live multi-node churn to prove reconnect storms and overlapping sessions do not strand nodes online or elect stale primaries.
    validation_type: reconnect-recovery
    proposed_validation: Run a small tailnet with one ordinary node and one subnet-router or relay target, inject reconnect storms plus overlapping disconnects, and confirm ordinary reconnects stay lightweight while topology-changing nodes still trigger exactly one recompute.
    success_condition: No node remains stranded online after its final session release, ordinary reconnects stay lightweight, and primary-route changes only occur when the live candidate set changes.
    priority: high
    status: open
    created: 2026-09-16
    last_updated: 2026-09-16
  - id: 2026-09-16-gnuradio-flowgraph-restart
    family: satellites-space-systems
    source_report: reports/2026-09-16.md
    source_repository: gnuradio/gnuradio
    mechanism: lock-gated flowgraph restart and scheduler recreation
    evidence_gap: Source and tests show the restart path, but the repository still needs a live scheduler fault or midstream reconfiguration run to prove restart keeps the graph coherent under real workload pressure.
    validation_type: restart-recovery
    proposed_validation: Start a live flowgraph, lock it, change the block chain, interrupt the scheduler or inject a block fault, then unlock and restart to verify the reflattened graph and recreated scheduler recover without deadlock or stale wiring.
    success_condition: Restart revalidates the graph, reconnects cleanly, and resumes output without deadlock, stale connections, or leaked scheduler state.
    priority: medium
    status: open
    created: 2026-09-16
    last_updated: 2026-09-16

  - id: 2026-09-19-docling-stage-timeout
    family: document-ai-ocr
    source_report: reports/2026-09-19.md
    source_repository: docling-project/docling
    mechanism: timeout-bounded threaded PDF pipeline with page retention
    evidence_gap: The source and tests show timeout handling and partial-success recovery, but we still need an end-to-end mixed-quality batch run to confirm the behavior under realistic OCR/model latency and resource pressure.
    validation_type: runtime
    proposed_validation: Run a mixed PDF batch with one intentionally blocking stage and one malformed page set, then compare final document shape, page retention, and timeout behavior against the expected partial-success result.
    success_condition: The job completes without hanging, failed pages remain present, and the result status is PARTIAL_SUCCESS with stable page numbering.
    priority: medium
    status: open
    created: 2026-09-19
    last_updated: 2026-09-19

  - id: 2026-09-19-defguard-reconnect-recovery
    family: privacy-networking-vpn
    source_report: reports/2026-09-19.md
    source_repository: DefGuard/gateway
    mechanism: disconnect-safe interface rehydration
    evidence_gap: Source and unit tests cover purge-then-configure, but the reconnect path still needs live network validation across disconnects, interface recreation, and firewall reapplication.
    validation_type: reconnect-recovery
    proposed_validation: Bring the gateway up, drop the control-plane connection, remove the WireGuard interface, then reconnect and confirm the gateway recreates the interface and reapplies the expected firewall state.
    success_condition: After reconnect, the gateway restores the interface and access policy without manual intervention or route leakage.
    priority: medium
    status: open
    created: 2026-09-19
    last_updated: 2026-09-19

  - id: 2026-09-19-px4-sitl-failsafe
    family: drones-robotics-autonomy
    source_report: reports/2026-09-19.md
    source_repository: PX4/PX4-Autopilot
    mechanism: failsafe command acknowledgment matrix with sensor-loss recovery
    evidence_gap: Source and tests show ACK and failsafe logic, but the mission/sensor-loss recovery path still needs a full SITL run with command loss and sensor degradation.
    validation_type: sitl
    proposed_validation: Run PX4 SITL with mission, RTL, and offboard transitions while injecting sensor loss and command rejection cases, then compare ACKs and recovery mode transitions against the source-level expectations.
    success_condition: The simulator produces accepted, denied, or temporarily rejected ACKs as expected and transitions into the intended failsafe recovery modes without unstable oscillation.
    priority: high
    status: open
    created: 2026-09-19
    last_updated: 2026-09-19

  - id: 2026-09-19-fprime-operational-routing
    family: satellites-space-systems
    source_report: reports/2026-09-19.md
    source_repository: nasa/fprime
    mechanism: context-preserving packet router with CFDP transaction management
    evidence_gap: The source and unit tests cover routing and CFDP failure cases, but the packet-ordering and queue-depth behavior still needs an operational integration run under realistic message load.
    validation_type: operational
    proposed_validation: Exercise the router and CFDP manager in an integration harness with delayed buffer returns, out-of-order packets, and queue saturation, then confirm context restoration and transaction completion semantics.
    success_condition: Context is preserved across returns, command/file routing remains correct, and CFDP transactions fail or complete cleanly without deadlock.
    priority: medium
    status: open
    created: 2026-09-19
    last_updated: 2026-09-19

  - id: 2026-09-22-durable-agent-runtime-fault-injection
    family: ai-llm-systems
    source_report: reports/2026-09-22.md
    source_repository: rmax-ai/durable-agent-runtime-lab
    mechanism: deterministic proposal boundary and append-only hash-chained workflow ledger
    evidence_gap: Source and tests show the durable workflow path and deterministic fault injection, but the review did not validate an actual process-kill and restart cycle on the same workflow ledger.
    validation_type: failure-injection
    proposed_validation: Start a goal run, inject a process-kill fault after workflow creation or planning, restart the runtime, and confirm the ledger, state projection, and idempotency checks replay the same workflow without duplicate side effects.
    success_condition: The restarted runtime reconstructs the workflow from durable state, no action is committed twice, and the event hash chain remains valid after recovery.
    priority: high
    status: open
    created: 2026-09-22
    last_updated: 2026-09-22

  - id: 2026-09-22-autonomous-uav-sitl-hold
    family: drones-robotics-autonomy
    source_report: reports/2026-09-22.md
    source_repository: EspiroFares/Autonomous-UAV
    mechanism: canonical hold boundary with single FCU gateway
    evidence_gap: Source and unit tests show the hold policy and FCU bridge, but the review did not validate repeated world-model silence and bridge restart behavior in a longer SITL mission.
    validation_type: sitl
    proposed_validation: Run a long SITL mission with repeated target-loss, world-model silence, and FCU bridge restarts, then verify the controller always converges to the canonical hold command before any unsafe actuation reaches the bridge.
    success_condition: Every dropout or restart produces the same safe hold output, no stale setpoint is forwarded, and mission state remains consistent across recovery.
    priority: high
    status: open
    created: 2026-09-22
    last_updated: 2026-09-22

  - id: 2026-09-22-hdtn-operational-routing
    family: satellites-space-systems
    source_report: reports/2026-09-22.md
    source_repository: nasa/HDTN
    mechanism: contact-plan driven route recomputation with storage-gated forwarding
    evidence_gap: Source and tests show the route and storage plumbing, but the review did not validate live contact-plan churn, storage pressure, and delayed transport together in an operational run.
    validation_type: operational
    proposed_validation: Run HDTN with a live contact-plan update sequence, intentional storage pressure, and delayed or lossy transport, then confirm route updates, link notifications, and storage restore behavior remain coherent without stale forwarding state.
    success_condition: Route recomputation tracks the live plan, storage exhaustion suppresses forwarding safely, and recovery from restore does not reintroduce stale routes or duplicate bundles.
    priority: medium
    status: open
    created: 2026-09-22
    last_updated: 2026-09-22

  - id: 2026-10-07-openocr-runtime
    family: document-ai-ocr
    source_report: reports/2026-10-07.md
    source_repository: Topdu/OpenOCR
    mechanism: layout-aware document parsing pipeline
    evidence_gap: The source and tests cover task dispatch and serialization helpers, but the doc pipeline still needs a mixed real-document runtime run to prove page-level provenance and serialized outputs survive partial failures.
    validation_type: runtime
    proposed_validation: Run the doc task over a mixed PDF corpus with tables, formulas, charts, and malformed pages, then compare `layout_det_res`, `parsing_res_list`, JSON output, and Markdown output against the expected page-level structure.
    success_condition: The document task keeps page ordering, block provenance, and exporter output aligned even when a subset of pages or blocks fail.
    priority: medium
    status: open
    created: 2026-10-07
    last_updated: 2026-10-07

  - id: 2026-10-07-dybervpn-reconnect-recovery
    family: privacy-networking-vpn
    source_report: reports/2026-10-07.md
    source_repository: dyber-pqc/DyberVPN
    mechanism: policy-guarded route reconciliation loop
    evidence_gap: The source proves full-key policy enforcement and CRL hot reload, but the reconnect and reload path still needs live churn to prove policy and revocation stay coherent after disconnects.
    validation_type: reconnect-recovery
    proposed_validation: Run the tunnel through a disconnect/reconnect cycle while reloading policy and CRL updates, then confirm revoked peers stay blocked, reinstated peers recover, and no stale route or key-acceptance state survives the churn.
    success_condition: Reconnects and reloads converge on the current policy and CRL state without reviving stale access.
    priority: high
    status: open
    created: 2026-10-07
    last_updated: 2026-10-07

  - id: 2026-10-07-meshswarm-restart-recovery
    family: drones-robotics-autonomy
    source_report: reports/2026-10-07.md
    source_repository: AkitaEngineering/MeshSwarm
    mechanism: mission failsafe fallback state machine
    evidence_gap: The source and tests show the control and failsafe loops, but the mesh and FCU path still needs real restart churn to prove ACK, telemetry, and RTL recovery remain stable.
    validation_type: restart-recovery
    proposed_validation: Run a live mesh with forced disconnects, command replay, and FCU restarts, then confirm the GCS reconnects, ACK state resynchronizes, and the drone converges back to the same canonical RTL path without duplicate stale commands.
    success_condition: Restart churn does not break ACK sync, replay rejection, or RTL latching on the live mesh path.
    priority: high
    status: open
    created: 2026-10-07
    last_updated: 2026-10-07

  - id: 2026-10-07-cfs-operational-bundle
    family: satellites-space-systems
    source_report: reports/2026-10-07.md
    source_repository: nasa/cFS
    mechanism: bundle-level command/telemetry loop
    evidence_gap: The bundle and unit tests show command/telemetry plumbing, but the demo bundle still needs an operational run to prove the full command/telemetry loop behaves coherently outside the nominal build/run path.
    validation_type: operational
    proposed_validation: Run the bundle through a full operational harness with a real or emulated ground system, then confirm the command path, housekeeping loop, and telemetry forwarding stay coherent under startup and runtime churn.
    success_condition: Command dispatch, housekeeping, and telemetry forwarding remain coherent under end-to-end bundle operation.
    priority: medium
    status: open
    created: 2026-10-07
    last_updated: 2026-10-07

  - id: 2026-10-07-sam-fleet-mesh
    family: ai-llm-systems
    source_report: reports/2026-10-07.md
    source_repository: google/sam
    mechanism: sidecar-backed mesh agent envelope
    evidence_gap: The source and integration tests cover the sidecar and mesh API, but the runtime still needs a live multi-node fleet run to prove discovery, auth, and tool calls survive mesh churn.
    validation_type: fleet
    proposed_validation: Run a multi-node mesh with one sam-node, one router, and at least one SDK member, then restart the sidecar and a peer mid-run to confirm discovery, auth, and remote tool calls recover without leaking or duplicating credentials.
    success_condition: Discovery, auth, and remote tool invocation survive churn without credential leakage or duplicated requests.
    priority: high
    status: open
    created: 2026-10-07
    last_updated: 2026-10-07
