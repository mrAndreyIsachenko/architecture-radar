name: Radar Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.6.0

      - name: Check script syntax
        run: |
          bash -n scripts/check-radar-cadence.sh
          bash -n scripts/check-radar-rerun.sh
          bash -n scripts/prepare-radar-run.sh
          bash -n scripts/prepare-opportunity-radar-run.sh
          bash -n scripts/prepare-weekly-synthesis-run.sh
          bash -n scripts/publish-opportunity-radar-run.sh
          bash -n scripts/publish-radar-run.sh
          bash -n scripts/publish-weekly-synthesis-run.sh
          bash -n scripts/run-codex-opportunity-radar.sh
          bash -n scripts/run-codex-radar.sh
          bash -n scripts/run-codex-weekly-synthesis.sh
          python3 -m py_compile scripts/radar-pr-review.py
          python3 -m py_compile scripts/radar-pr-review-status.py
          python3 -m py_compile scripts/check-radar-setup.py
          python3 -m py_compile scripts/mark-generated-pr-validation.py
          python3 -m py_compile scripts/summarize-radar-pr.py
          python3 -m py_compile scripts/summarize-radar-report.py
          python3 -m py_compile scripts/validate-opportunity-radar-state.py
          python3 -m py_compile scripts/validate-radar-state.py
          python3 -m py_compile scripts/validate-weekly-synthesis-state.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Validate OpenSpec
        run: openspec validate --all --strict --no-interactive

      - name: Check local setup
        run: python3 scripts/check-radar-setup.py --skip-github

      - name: Check changed-file whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Validate radar artifacts
        env:
          ARCHITECTURE_RADAR_BASE_REF: ${{ github.base_ref }}
        run: scripts/validate-radar-state.py

      - name: Validate opportunity radar artifacts
        env:
          OPPORTUNITY_RADAR_BASE_REF: ${{ github.base_ref }}
        run: scripts/validate-opportunity-radar-state.py

      - name: Validate weekly synthesis artifacts
        env:
          WEEKLY_SYNTHESIS_BASE_REF: ${{ github.base_ref }}
        run: scripts/validate-weekly-synthesis-state.py
