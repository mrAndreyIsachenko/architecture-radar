name: Architecture Radar

on:
  schedule:
    # GitHub cron is UTC. A lightweight cadence gate below lets the
    # expensive Codex research run every three days at 08:00 Europe/Moscow.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Override report date in YYYY-MM-DD format"
        required: false
        type: string
      model:
        description: "Override Codex model for this manual run"
        required: false
        type: string
      force_research:
        description: "Run Codex even if today's report already exists"
        required: false
        type: boolean
        default: false
      recovery_smoke:
        description: "Test recovery upload without a model (expected failed run)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: architecture-radar
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name != 'workflow_dispatch' || !inputs.recovery_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Europe/Moscow
      CODEX_HOME: /home/runner/.codex
      CODEX_MODEL: ${{ github.event.inputs.model || vars.ARCHITECTURE_RADAR_CODEX_MODEL || 'gpt-5.4-mini' }}
      ARCHITECTURE_RADAR_DATE: ${{ github.event.inputs.run_date || '' }}
      ARCHITECTURE_RADAR_FORCE_RESEARCH: ${{ github.event.inputs.force_research || 'false' }}
      ARCHITECTURE_RADAR_CADENCE_ANCHOR: "2026-08-02"
      ARCHITECTURE_RADAR_CADENCE_DAYS: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check research cadence
        id: cadence
        run: scripts/check-radar-cadence.sh

      - name: Skip scheduled run
        if: steps.cadence.outputs.should_run != 'true'
        run: |
          echo "Skipping expensive research step: ${{ steps.cadence.outputs.reason }}"

      - name: Check rerun scope
        id: rerun
        if: steps.cadence.outputs.should_run == 'true'
        run: scripts/check-radar-rerun.sh

      - name: Skip duplicate run
        if: steps.cadence.outputs.should_run == 'true' && steps.rerun.outputs.should_run != 'true'
        run: |
          echo "Skipping expensive research step: ${{ steps.rerun.outputs.reason }}"

      - name: Set up Node.js
        if: steps.cadence.outputs.should_run == 'true' && steps.rerun.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Codex CLI
        if: steps.cadence.outputs.should_run == 'true' && steps.rerun.outputs.should_run == 'true'
        run: npm install -g @openai/codex@0.146.0

      - name: Authenticate Codex
        if: steps.cadence.outputs.should_run == 'true' && steps.rerun.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          mkdir -p "$CODEX_HOME"
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key

      - name: Prepare dated branch
        if: steps.cadence.outputs.should_run == 'true' && steps.rerun.outputs.should_run == 'true'
        run: scripts/prepare-radar-run.sh

      - name: Run research agent
        id: research
        if: steps.cadence.outputs.should_run == 'true' && steps.rerun.outputs.should_run == 'true'
        run: scripts/run-codex-radar.sh

      - name: Normalize evidence labels
        if: steps.cadence.outputs.should_run == 'true' && steps.rerun.outputs.should_run == 'true'
        run: python3 scripts/normalize-radar-evidence-labels.py

      - name: Repair report structure
        if: steps.cadence.outputs.should_run == 'true' && steps.rerun.outputs.should_run == 'true'
        run: python3 scripts/repair-radar-report-structure.py

      - name: Validate radar artifacts
        if: steps.cadence.outputs.should_run == 'true' && steps.rerun.outputs.should_run == 'true'
        run: scripts/validate-radar-state.py

      - name: Publish pull request
        if: steps.cadence.outputs.should_run == 'true' && steps.rerun.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-radar-run.sh

      - name: Stage failed research output
        id: recovery
        if: failure() && (steps.research.outcome == 'success' || steps.research.outcome == 'failure')
        run: python3 scripts/stage-radar-recovery.py --output "$RUNNER_TEMP/radar-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Preserve failed research output
        if: failure() && steps.recovery.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: radar-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/radar-recovery-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false

  recovery-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ARCHITECTURE_RADAR_RUN_DATE: "9999-12-31"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Produce intentionally invalid research fixture
        id: research
        run: cp tests/fixtures/recovery-invalid-report.md reports/9999-12-31.md

      - name: Validate radar artifacts (expected failure)
        run: scripts/validate-radar-state.py

      - name: Publication must remain blocked
        run: |
          echo "::error::Invalid fixture unexpectedly passed validation"
          exit 1

      - name: Stage failed research output
        id: recovery
        if: failure() && (steps.research.outcome == 'success' || steps.research.outcome == 'failure')
        run: python3 scripts/stage-radar-recovery.py --output "$RUNNER_TEMP/radar-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Preserve failed research output
        if: failure() && steps.recovery.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: radar-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/radar-recovery-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
