name: Architecture Radar

on:
  schedule:
    # GitHub cron is UTC. A lightweight cadence gate below lets the
    # expensive Codex research run every three days at 08:00 Europe/Moscow.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Override report date in YYYY-MM-DD format"
        required: false
        type: string
      model:
        description: "Override Codex model for this manual run"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: architecture-radar
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Europe/Moscow
      CODEX_HOME: /home/runner/.codex
      CODEX_MODEL: ${{ github.event.inputs.model || vars.ARCHITECTURE_RADAR_CODEX_MODEL || 'gpt-5.5' }}
      ARCHITECTURE_RADAR_DATE: ${{ github.event.inputs.run_date || '' }}
      ARCHITECTURE_RADAR_CADENCE_ANCHOR: "2026-08-02"
      ARCHITECTURE_RADAR_CADENCE_DAYS: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check research cadence
        id: cadence
        run: scripts/check-radar-cadence.sh

      - name: Skip scheduled run
        if: steps.cadence.outputs.should_run != 'true'
        run: |
          echo "Skipping expensive research step: ${{ steps.cadence.outputs.reason }}"

      - name: Set up Node.js
        if: steps.cadence.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Codex CLI
        if: steps.cadence.outputs.should_run == 'true'
        run: npm install -g @openai/codex@0.146.0

      - name: Authenticate Codex
        if: steps.cadence.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          mkdir -p "$CODEX_HOME"
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key

      - name: Prepare dated branch
        if: steps.cadence.outputs.should_run == 'true'
        run: scripts/prepare-radar-run.sh

      - name: Run research agent
        if: steps.cadence.outputs.should_run == 'true'
        run: scripts/run-codex-radar.sh

      - name: Validate radar artifacts
        if: steps.cadence.outputs.should_run == 'true'
        run: scripts/validate-radar-state.py

      - name: Publish pull request
        if: steps.cadence.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-radar-run.sh
