# Sources and artifacts the Opportunity Demand Radar should not miss.

entries:
  - repository: langchain-ai/langgraph
    url: https://github.com/langchain-ai/langgraph
    family: ai-llm-demand
    artifact_type: repository
    priority: medium
    status: watch
    review_mode: triage-only
    reason: Watch issue and discussion patterns around agent orchestration, durability, observability, and enterprise deployment pain.
    external_artifacts:
      - https://langchain-ai.github.io/langgraph/
    search_terms:
      - LangGraph production issues
      - agent durability
      - agent observability

  - repository: tailscale/tailscale
    url: https://github.com/tailscale/tailscale
    family: privacy-networking-demand
    artifact_type: repository
    priority: medium
    status: watch
    review_mode: triage-only
    reason: Watch recurring operational pain around private networking, policy, device enrollment, routing, and diagnostics.
    external_artifacts:
      - https://tailscale.com/kb
    search_terms:
      - split tunnel
      - DNS leak
      - device posture

  - repository: ArduPilot/ardupilot
    url: https://github.com/ArduPilot/ardupilot
    family: drones-robotics-demand
    artifact_type: repository
    priority: medium
    status: watch
    review_mode: triage-only
    reason: Watch recurring autonomy, mission planning, telemetry, simulation, and failsafe pain.
    external_artifacts:
      - https://ardupilot.org/
    search_terms:
      - mission replay
      - failsafe
      - telemetry loss
